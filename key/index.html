<!DOCTYPE html>

<head>

<style>
  body{min-height:100vh;display:flex;flex-direction:column}
  .k-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px 60px}
  .k-card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .k-art{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;border-bottom:1px solid var(--border)}
  .k-body{padding:26px 26px 30px}
  .k-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)}
  .k-title{font-size:26px;font-weight:800;line-height:1.2;margin:6px 0 10px}
  .k-muted{color:var(--text-muted);font-size:14px}
  .k-for{font-family:var(--mono);font-size:14px;background:var(--bg-alt);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin:12px 0 18px;word-break:break-all}
  .k-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:8px;border:1px solid var(--text);background:var(--text);color:var(--bg);font:700 16px var(--body);cursor:pointer;text-decoration:none}
  .k-btn.sec{background:transparent;color:var(--text);border-color:var(--border)}
  .k-btn:disabled{opacity:.6;cursor:wait}
  .k-key{display:flex;gap:8px;align-items:stretch;margin:16px 0 12px}
  .k-key code{flex:1;font:700 clamp(17px,5vw,22px) var(--mono);letter-spacing:1px;text-align:center;padding:14px 8px;background:var(--bg-alt);border:1px dashed var(--text-muted);border-radius:8px;user-select:all}
  .k-key button{width:auto;padding:0 16px;font-size:14px}
  .k-stack{display:grid;gap:10px;margin-top:6px}
  .k-sep{border:0;border-top:1px solid var(--border);margin:24px 0}
  .k-row{display:flex;gap:8px;margin-top:10px}
  .k-row input{flex:1;min-width:0;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:15px var(--body)}
  .k-row button{width:auto}
  .k-msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:6px;background:var(--bg-alt);border:1px solid var(--border)}
  .k-msg:empty{display:none}
  .k-ok{margin-top:10px;font-size:14px;padding:10px 12px;border-radius:6px;background:rgba(76,194,127,.12);border:1px solid rgba(76,194,127,.45);color:#5fd394}
  .k-ok.err{background:rgba(255,116,102,.1);border-color:rgba(255,116,102,.45);color:#ff8a7d}
  .k-spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:kspin .7s linear infinite}
  @keyframes kspin{to{transform:rotate(360deg)}}
  .k-list{margin-top:6px;font-size:13px;color:var(--text-muted)}.k-list li{padding:3px 0;word-break:break-all}.k-list li::before{content:"✓ ";color:#5fd394}
  .hidden{display:none!important}
  footer.k-foot{text-align:center;color:var(--text-muted);font-size:13px;padding:0 16px 30px}
  footer.k-foot a{color:var(--text-muted)}
</style>
</head>

function decodeEmail(e){ try{ e=e.replace(/-/g,"+").replace(/_/g,"/"); while(e.length%4) e+="="; return decodeURIComponent(escape(atob(e))); }catch(_){ return ""; } }
const email = decodeEmail(q.get("e") || "");
const token = q.get("t") || "";
const pl = (POOL_LABEL[pool] || {});
$("title").textContent = T.title.replace("{p}", pl[lang] ?? pl.en ?? "");
function msg(t){ $("msg").textContent = t || ""; }

async function api(params){
  const u = API_URL + "?" + new URLSearchParams({...params, e:q.get("e"), t:token, pool:pool});
  const r = await fetch(u, {redirect:"follow"});
  return r.json();
}

const APPID = (STEAM_URL.match(/app\/(\d+)/) || [])[1] || "";
const STORE_KEY = "circusar_" + pool + "_" + email;
function store(k, v){ try{ if (v === undefined) return JSON.parse(localStorage.getItem(STORE_KEY + k) || "null"); localStorage.setItem(STORE_KEY + k, JSON.stringify(v)); }catch(_){ return null; } }
function webActivate(key){ return "https://store.steampowered.com/account/registerkey?key=" + encodeURIComponent(key); }

/* Steam uygulamasi varsa onu ac; birkac saniye icinde sayfa odagi kaybetmezse (uygulama yok) tarayicida ac */
function openSteam(appUrl, webUrl){
  let left = false;
  const mark = () => { left = true; };
  window.addEventListener("blur", mark);
  document.addEventListener("visibilitychange", mark);
  location.href = appUrl;
  setTimeout(() => {
    window.removeEventListener("blur", mark);
    document.removeEventListener("visibilitychange", mark);
    if (!left) window.open(webUrl, "_blank", "noopener");
  }, 2200);
}

function showKey(key, again){
  $("s-start").classList.add("hidden"); $("s-key").classList.remove("hidden");
  $("key").textContent = key;
  $("t-again").textContent = again ? T.again : "";
  $("lnk-web").href = webActivate(key);
  store("key", key);
}

async function copyKey(){
  const k = $("key").textContent;
  try{ await navigator.clipboard.writeText(k); return true; }
  catch(_){ const r = document.createRange(); r.selectNodeContents($("key")); getSelection().removeAllRanges(); getSelection().addRange(r); try{ return document.execCommand("copy"); }catch(__){ return false; } }
}

function renderCovList(){
  const list = store("cov") || [];
  $("t-cov-list").classList.toggle("hidden", !list.length);
  $("cov-list").innerHTML = "";
  list.forEach(u => { const li = document.createElement("li"); li.textContent = u; $("cov-list").appendChild(li); });
}
function covMsg(text, isErr){ const m = $("cov-msg"); m.textContent = text; m.classList.toggle("err", !!isErr); m.classList.remove("hidden"); }

$("t-for").textContent = T.for; $("btn-get").textContent = T.get; $("btn-copy").textContent = T.copy;
$("btn-activate").textContent = "▶ " + T.activate; $("t-manual").textContent = T.manual; $("lnk-web").textContent = T.web;
$("btn-wish").textContent = "♥ " + T.wish;
$("t-cov-title").textContent = T.covT; $("t-cov-text").textContent = T.covX; $("btn-cov").textContent = T.send; $("t-cov-list").textContent = T.list;

if (!email || !token) { msg(T.nolink); }
else {
  $("who").textContent = email;
  const cached = store("key");
  if (cached) showKey(cached, true);
  else {
    $("s-start").classList.remove("hidden");
    api({a:"ping"}).catch(() => {});   // sunucuyu simdiden uyandir
  }
  renderCovList();
}

$("btn-get").onclick = async () => {
  const b = $("btn-get"); b.disabled = true; msg("");
  b.innerHTML = '<span class="k-spin"></span> ' + T.loading;
  const slow = setTimeout(() => { b.innerHTML = '<span class="k-spin"></span> ' + T.long; }, 3500);
  try{
    const r = await api({a:"claim"});
    if (r.ok) showKey(r.key, r.again);
    else msg(r.error === "invalid" ? T.invalid : r.error === "empty" ? T.empty : T.net);
  }catch(_){ msg(T.net); }
  clearTimeout(slow); b.disabled = false; b.textContent = T.get;
};
$("btn-copy").onclick = async () => {
  await copyKey();
  $("btn-copy").textContent = T.copied; setTimeout(() => $("btn-copy").textContent = T.copy, 1500);
};
$("btn-activate").onclick = async () => {
  await copyKey();
  $("act-hint").textContent = T.hint; $("act-hint").classList.remove("hidden");
  openSteam("steam://open/activateproduct", webActivate($("key").textContent));
};
$("btn-wish").onclick = () => openSteam("steam://store/" + APPID, STEAM_URL);

$("btn-cov").onclick = async () => {
  const url = $("cov").value.trim();
  if (!/^https?:\/\/[^\s\/]+\.[^\s\/]{2,}(\/\S*)?$/i.test(url)) { covMsg(T.badUrl, true); return; }
  const list = store("cov") || [];
  if (list.includes(url)) { covMsg(T.dup); return; }
  const b = $("btn-cov"); b.disabled = true; b.innerHTML = '<span class="k-spin"></span>';
  covMsg(T.sending);
  try{
    const r = await api({a:"coverage", url});
    if (r.ok) { covMsg(r.dup ? T.dup : T.covOk); list.push(url); store("cov", list); renderCovList(); $("cov").value = ""; }
    else covMsg(r.error === "bad_url" ? T.badUrl : T.net, true);
  }catch(_){ covMsg(T.net, true); }
  b.disabled = false; b.textContent = T.send;
};
</script>
